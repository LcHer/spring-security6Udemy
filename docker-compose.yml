services:
  db:
    image: postgres:15.2
    container_name: security_bank
    restart: always
    volumes:
      - ./db/sql/create_schema.sql:/docker-entrypoint-initdb.d/create_schema.sql
      - ./db/sql/data.sql:/docker-entrypoint-initdb.d/data.sql
    environment:
      - POSTGRES_DB=security_bank
      - POSTGRES_USER=alejandro
      - POSTGRES_PASSWORD=debugueandoideas
    ports:
      - "5432:5432"
  # >>> AGREGA ESTE NUEVO SERVICIO ABAJO <<<
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bank
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=alejandro@correo.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8080:80" # <-- Este será el puerto para tu navegador
    depends_on:
      - db